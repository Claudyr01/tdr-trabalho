name: Renderizar Relatorio

on:
  push:
    branches:
      - trabalho
      - main
  pull_request:
    branches:
      - trabalho
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Configurar Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar dependencias do sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Configurar e restaurar ambiente renv
        uses: r-lib/actions/setup-renv@v2

      - name: Executar pipeline e renderizar relatorio
        run: |
          Rscript -e "targets::tar_make()"

      - name: Publicar artefacto do relatorio HTML
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-html
          path: relatorio.html
